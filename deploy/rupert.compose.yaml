# Portainer stack: timemachine, on Raspberry Pi rupert.
services:
  core:
    image: ghcr.io/marchrius/timemachine:4.23.13
    pull_policy: missing
    hostname: Time-Capsule
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      EXTERNAL_CONF: /users
      SET_PERMISSIONS: "false"
      HIDE_SHARES: "yes"
      MIMIC_MODEL: TimeCapsule8,119
    volumes:
      - type: bind
        source: /mnt/timemachine
        target: /opt
        bind:
          create_host_path: false
      - type: bind
        source: /home/matteo/timemachine/users
        target: /users
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: samba-state
        target: /var/lib/samba
        volume:
          nocopy: true
    tmpfs:
      - /run/samba
    networks:
      lan:
        ipv4_address: 192.168.3.54
        mac_address: 02:42:c0:a8:03:36
        aliases:
          - core
          - timemachine-core-1
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        - CMD-SHELL
        - 'for p in smbd nmbd avahi-daemon dbus-daemon; do pidof "$$p" >/dev/null || exit 1; done; testparm -s >/dev/null 2>&1'
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
networks:
  lan:
    name: timemachine_lan
    driver: macvlan
    driver_opts:
      parent: end0
    ipam:
      config:
        - subnet: 192.168.3.0/24
          ip_range: 192.168.3.54/32
          gateway: 192.168.3.254
volumes:
  samba-state:
    external: true
    name: timemachine_samba_state
