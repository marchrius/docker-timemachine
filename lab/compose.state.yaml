# Use only through state-transfer.py, which enforces one active server.
services:
  reference: &state-server
    image: timemachine-samba-lab:reference-4.23.8
    pull_policy: never
    hostname: tm-state-lab
    entrypoint: ["/bin/sh", "/lab/state-init.sh"]
    command: ["s6-svscan", "/etc/s6"]
    environment: &state-environment
      TIMEMACHINE_ISOLATED_LAB: "yes"
      STATE_TRANSFER_LAB: "yes"
      EXTERNAL_CONF: /run/lab/users
      SET_PERMISSIONS: "false"
      HIDE_SHARES: "yes"
      EXPECTED_SAMBA_VERSION: "4.23.8"
    volumes:
      - state-synthetic-data:/opt
      - ./state-init.sh:/lab/state-init.sh:ro
      - ./state-probe.sh:/lab/state-probe.sh:ro
      - ./smoke.sh:/lab/smoke.sh:ro
    tmpfs: [/run]
    networks: [isolated]
    restart: "no"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
  candidate:
    <<: *state-server
    image: timemachine-samba-lab:candidate-4.23.13
    environment:
      <<: *state-environment
      EXPECTED_SAMBA_VERSION: "4.23.13"
networks:
  isolated:
    internal: true
volumes:
  state-synthetic-data:
